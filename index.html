<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>StickNodes Studio</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --border: #e3e6ec; --border-strong: #cfd4dd;
    --text: #1a1d24; --muted: #6b7280;
    --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef2ff;
    --ok: #059669; --ok-soft: #ecfdf5; --err: #dc2626; --err-soft: #fef2f2;
    --radius: 10px; --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(20,20,40,.05);
    --shadow: 0 1px 3px rgba(20,20,40,.08), 0 4px 12px rgba(20,20,40,.04);
    --shadow-lg: 0 4px 12px rgba(20,20,40,.08), 0 12px 32px rgba(20,20,40,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
         "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text);
         overflow: hidden; -webkit-font-smoothing: antialiased; }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh;
         max-width: 1400px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between;
           gap: 12px; padding: 14px 20px; background: var(--panel);
           border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  header .brand { display: flex; align-items: center; gap: 10px;
                  font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  header .brand .dot { width: 10px; height: 10px; border-radius: 50%;
                       background: linear-gradient(135deg, #6366f1, #8b5cf6);
                       box-shadow: 0 0 0 3px var(--accent-soft); }
  header .status { display: flex; align-items: center; gap: 6px; font-size: 12px;
                   color: var(--muted); padding: 5px 10px; background: var(--bg);
                   border-radius: 20px; border: 1px solid var(--border); }
  header .status .led { width: 7px; height: 7px; border-radius: 50%;
                        background: var(--muted); transition: background .2s; }
  header .status.ready .led { background: var(--ok); box-shadow: 0 0 6px rgba(5,150,105,.5); }
  header .status.error .led { background: var(--err); }

  .toolbar { display: flex; gap: 8px; padding: 12px 20px; background: var(--panel);
             border-bottom: 1px solid var(--border); flex: 0 0 auto;
             overflow-x: auto; scrollbar-width: none; }
  .toolbar::-webkit-scrollbar { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px;
         font: inherit; font-weight: 500; font-size: 13px; color: var(--text);
         background: var(--panel); border: 1px solid var(--border-strong);
         border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
         min-height: 38px; transition: all .12s ease; box-shadow: var(--shadow-sm); }
  .btn:hover { background: #fafbfd; border-color: #b6bcc7; }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff;
                 box-shadow: 0 1px 3px rgba(79,70,229,.3), 0 4px 12px rgba(79,70,229,.15); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn svg { width: 14px; height: 14px; stroke-width: 2; fill: none; stroke: currentColor; }
  .btn.toggle.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  select.preset { font: inherit; font-size: 13px; font-weight: 500; padding: 9px 12px;
                  background: var(--panel); border: 1px solid var(--border-strong);
                  border-radius: var(--radius-sm); cursor: pointer; min-height: 38px;
                  color: var(--text); box-shadow: var(--shadow-sm); }
  .spacer { flex: 1; }

  .content { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 1fr;
             gap: 12px; padding: 12px 20px 20px; min-height: 0; }
  @media (max-width: 900px) {
    .content { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    header { padding: 12px 14px; } .toolbar { padding: 10px 14px; }
    .content { padding: 10px 14px 14px; }
  }

  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: var(--radius); box-shadow: var(--shadow);
          display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card-head { display: flex; align-items: center; justify-content: space-between;
               padding: 10px 14px; border-bottom: 1px solid var(--border);
               background: #fbfcfe; flex: 0 0 auto; }
  .card-head h2 { margin: 0; font-size: 12px; font-weight: 600;
                  text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .card-head .meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .preview-wrap { position: relative; flex: 1 1 auto; min-height: 0;
                  display: flex; align-items: center; justify-content: center;
                  padding: 12px; overflow: hidden; background: #fbfcfe; }
  canvas { display: block; max-width: 100%; max-height: 100%;
           border-radius: var(--radius-sm); background: #ffffff;
           box-shadow: inset 0 0 0 1px var(--border); }

  textarea { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; outline: 0;
             resize: none; padding: 14px 16px;
             font: 12.5px/1.65 "SF Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
             color: var(--text); background: var(--panel); tab-size: 2; }
  textarea::selection { background: var(--accent-soft); }

  .bottom { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: #fbfcfe;
          border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .tabs button { padding: 9px 14px; font: inherit; font-size: 12px; font-weight: 600;
                 letter-spacing: 0.02em; color: var(--muted); background: transparent;
                 border: 0; border-bottom: 2px solid transparent; cursor: pointer;
                 border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: all .12s; }
  .tabs button:hover { color: var(--text); background: #f3f5f9; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent);
                        background: var(--panel); }
  .tab-content { flex: 1 1 auto; min-height: 0; overflow: auto; display: none;
                 background: var(--panel); }
  .tab-content.active { display: block; }

  #log { padding: 12px 16px; margin: 0;
         font: 11.5px/1.6 "SF Mono", ui-monospace, Consolas, monospace;
         white-space: pre-wrap; word-break: break-word; color: var(--text); }
  #log .line { padding: 2px 0; display: flex; gap: 8px; }
  #log .line .badge { flex: 0 0 auto; display: inline-flex;
                      align-items: center; justify-content: center;
                      min-width: 44px; padding: 1px 6px; font-size: 10px;
                      font-weight: 700; letter-spacing: 0.04em; border-radius: 4px;
                      height: 18px; margin-top: 1px; }
  #log .ok .badge  { background: var(--ok-soft); color: var(--ok); }
  #log .err .badge { background: var(--err-soft); color: var(--err); }
  #log .hi .badge  { background: var(--accent-soft); color: var(--accent); }
  #log .dim        { color: var(--muted); }
  #log .dim .badge { background: #f3f4f6; color: var(--muted); }
  #log .line .msg  { flex: 1; min-width: 0; }

  #tree { padding: 10px 14px; font: 12px/1.7 "SF Mono", ui-monospace, Consolas, monospace; }
  #tree .row { display: grid; grid-template-columns: auto 44px 140px 1fr;
               gap: 10px; padding: 3px 0; white-space: nowrap; border-radius: 4px; }
  #tree .row:hover { background: #f7f8fb; }
  #tree .branch { color: #d1d5db; }
  #tree .idx { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  #tree .type { color: #b45309; font-weight: 500; }
  #tree .props { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  #toast { position: fixed; left: 50%; bottom: 24px;
           transform: translateX(-50%) translateY(80px);
           background: #1a1d24; color: #fff; padding: 10px 18px;
           border-radius: 24px; font-size: 13px; font-weight: 500;
           box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
           transition: all .25s cubic-bezier(.2,.8,.2,1); z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  input[type=file] { display: none; }
  @media (max-width: 500px) {
    .toolbar .btn .label { display: none; }
    .toolbar .btn { padding: 9px 10px; }
    #tree .row { grid-template-columns: auto 38px 110px 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span>StickNodes Studio</div>
    <div class="status" id="status">
      <span class="led"></span><span id="statusText">loading…</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnBuild">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
      <span class="label">Build</span>
    </button>
    <button class="btn" id="btnDownload">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      <span class="label">Download</span>
    </button>
    <button class="btn" id="btnExport">
      <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h5"/></svg>
      <span class="label">Export XML</span>
    </button>
    <button class="btn" id="btnCopy">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
      <span class="label">Copy</span>
    </button>
    <button class="btn" id="btnLoad">
      <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M12 11v6m0 0l-3-3m3 3l3-3"/></svg>
      <span class="label">Load</span>
    </button>
    <button class="btn toggle" id="btnFlip" title="Flip Y axis in preview">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M4 12h16M7 8l-3 4 3 4M17 8l3 4-3 4"/></svg>
      <span class="label">Flip Y</span>
    </button>
    <button class="btn toggle on" id="btnFit" title="Robust fit (trim outliers)">
      <svg viewBox="0 0 24 24"><path d="M4 4h4M4 4v4M20 4h-4M20 4v4M4 20h4M4 20v-4M20 20h-4M20 20v-4"/></svg>
      <span class="label">Trim</span>
    </button>

    <div class="spacer"></div>

    <select class="preset" id="preset">
      <option value="">Load preset…</option>
      <option value="empty">Empty figure</option>
      <option value="standing">Standing humanoid</option>
      <option value="tpose">T-pose</option>
      <option value="running">Running</option>
      <option value="sitting">Sitting</option>
      <option value="waving">Waving</option>
    </select>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-head">
        <h2>Preview</h2>
        <span class="meta" id="previewMeta">—</span>
      </div>
      <div class="preview-wrap">
        <canvas id="preview" width="720" height="620"></canvas>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; min-height: 0; gap: 12px;">
      <div class="card" style="flex: 1 1 55%;">
        <div class="card-head">
          <h2>XML</h2>
          <span class="meta" id="xmlMeta">—</span>
        </div>
        <textarea id="xml" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
      </div>

      <div class="card bottom" style="flex: 1 1 45%;">
        <div class="tabs">
          <button data-tab="log" class="active">Log</button>
          <button data-tab="tree">Tree</button>
        </div>
        <div class="tab-content active" data-tab="log"><pre id="log"></pre></div>
        <div class="tab-content" data-tab="tree"><div id="tree"></div></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput">
<div id="toast"></div>

<script type="module">
const $ = id => document.getElementById(id);
const xmlEl = $('xml'), logEl = $('log'), treeEl = $('tree'), canvas = $('preview');
const fileInput = $('fileInput'), statusEl = $('status'), statusTextEl = $('statusText');
const xmlMeta = $('xmlMeta'), previewMeta = $('previewMeta'), toastEl = $('toast');

let flipY = false;   // when true, mirror vertical
let trimFit = true;  // when true, trim outliers from bbox

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}
function setStatus(state, text) {
  statusEl.className = 'status ' + (state || '');
  statusTextEl.textContent = text;
}
function logMsg(kind, msg) {
  const kc = { ok:'ok', err:'err', hi:'hi', dim:'dim' }[kind] || 'dim';
  const bt = { ok:'OK', err:'FAIL', hi:'INFO', dim:'···' }[kind] || '···';
  const line = document.createElement('div');
  line.className = 'line ' + kc;
  const b = document.createElement('span'); b.className = 'badge'; b.textContent = bt;
  const t = document.createElement('span'); t.className = 'msg'; t.textContent = msg;
  line.appendChild(b); line.appendChild(t);
  logEl.appendChild(line); logEl.scrollTop = logEl.scrollHeight;
  try { console.log('[studio]', kind, msg); } catch (_) {}
}
function clearLog() { logEl.textContent = ''; }

let mod = null;

async function loadLibrary() {
  setStatus('', 'loading library…');
  logMsg('hi', 'Fetching sticknodes_rs.js as text');
  let jsText;
  try {
    const r = await fetch('./sticknodes_rs.js', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    jsText = await r.text();
    logMsg('ok', 'fetched ' + jsText.length + ' chars');
  } catch (e) {
    logMsg('err', 'fetch sticknodes_rs.js: ' + e.message);
    setStatus('error', 'library fetch failed');
    throw e;
  }
  const blobUrl = URL.createObjectURL(new Blob([jsText], { type: 'application/javascript' }));
  try {
    mod = await import(blobUrl);
    logMsg('ok', 'module imported');
  } catch (e) {
    logMsg('err', 'import module: ' + e.message);
    setStatus('error', 'module error');
    throw e;
  } finally { URL.revokeObjectURL(blobUrl); }

  logMsg('hi', 'Fetching WASM binary');
  let wasmBytes;
  try {
    const r = await fetch('./sticknodes_rs_bg.wasm', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    wasmBytes = await r.arrayBuffer();
    logMsg('ok', 'fetched ' + wasmBytes.byteLength.toLocaleString() + ' bytes');
  } catch (e) {
    logMsg('err', 'fetch wasm: ' + e.message);
    setStatus('error', 'wasm fetch failed');
    throw e;
  }
  logMsg('hi', 'Initializing WASM');
  try {
    await mod.default(wasmBytes);
    logMsg('ok', 'WASM ready');
    setStatus('ready', 'ready');
  } catch (e) {
    logMsg('err', 'init: ' + e.message);
    setStatus('error', 'wasm init failed');
    throw e;
  }
}

const NODE_TYPE_NAME = {
  [-1]:'RootNode', 0:'RoundedSegment', 1:'Segment', 2:'Circle',
  3:'Triangle', 4:'FilledCircle', 5:'Ellipse', 6:'Trapezoid', 7:'Polygon'
};
const NODE_TYPE_VALID = {
  RoundedSegment:1, Segment:1, Circle:1, Triangle:1,
  FilledCircle:1, Ellipse:1, Trapezoid:1, Polygon:1
};

function parseHexObj(hex) {
  let h = String(hex).trim().replace(/^#/, '');
  if (h.length === 3) h = h.split('').map(c => c+c).join('') + 'FF';
  else if (h.length === 4) h = h.split('').map(c => c+c).join('');
  else if (h.length === 6) h += 'FF';
  else if (h.length !== 8) throw new Error('bad hex: ' + hex);
  const n = i => parseInt(h.slice(i, i+2), 16);
  const c = { red:n(0), green:n(2), blue:n(4), alpha:n(6) };
  if ([c.red,c.green,c.blue,c.alpha].some(v => Number.isNaN(v)))
    throw new Error('bad hex: ' + hex);
  return c;
}
const cssFromHex = hex => {
  const c = parseHexObj(hex);
  return 'rgba(' + c.red + ',' + c.green + ',' + c.blue + ',' +
         (c.alpha/255).toFixed(3) + ')';
};

const ATTR_NUM = {
  length:'length', defaultLength:'defaultLength',
  thickness:'thickness', defaultThickness:'defaultThickness',
  scale:'scale',
  angle:'localAngle', defaultAngle:'defaultAngle',
  defaultLocalAngle:'defaultLocalAngle',
  curveRadius:'segmentCurveRadiusAndDefaultCurveRadius',
  curvePrecision:'segmentCurvePolyfillPrecision',
  trapezoidStartThickness:'trapezoidThicknessStart',
  trapezoidEndThickness:'trapezoidThicknessEnd',
  polygonVertices:'numPolygonVertices',
  angleLockRelativeMultiplier:'angleLockRelativeMultiplier',
  dragLockAngle:'dragLockAngle',
  smartStretchMultiplier:'smartStretchMultiplier',
};
const ATTR_BOOL = {
  static:'isStatic', stretchy:'isStretchy', floaty:'isFloaty',
  smartStretch:'isSmartStretch',
  doNotApplySmartStretch:'doNotApplySmartStretch',
  smartStretchResetImpulse:'smartStretchResetImpulse',
  useSegmentColor:'useSegmentColor',
  useCircleOutline:'useCircleOutline',
  hollow:'circleIsHollow',
  useGradient:'useGradient', reverseGradient:'reverseGradient',
  useSegmentScale:'useSegmentScale',
  curveCirculization:'curveCirculization',
  halfArc:'halfArc',
  triangleFlipped:'triangleFlipped',
  triangleUpsideDown:'triangleUpsideDown',
  useTrapezoidStart:'useTrapezoidThicknessStart',
  useTrapezoidEnd:'useTrapezoidThicknessEnd',
  trapezoidRoundedStart:'trapezoidIsRoundedStart',
  trapezoidRoundedEnd:'trapezoidIsRoundedEnd',
  dragLocked:'isDragLocked',
};
const ATTR_COLOR = { color:'color', gradientColor:'gradientColor', outlineColor:'circleOutlineColor' };
const asBool = v => !(v === 'false' || v === '0' || v === '');

function nodeOptionsFromEl(el) {
  const o = {};
  if (el.hasAttribute('type')) {
    const t = el.getAttribute('type');
    if (!NODE_TYPE_VALID[t]) throw new Error('unknown node type "' + t + '"');
    o.nodeType = t;
  }
  for (const a in ATTR_NUM) {
    if (el.hasAttribute(a)) {
      const v = parseFloat(el.getAttribute(a));
      if (Number.isNaN(v)) throw new Error('<' + a + '> not a number');
      o[ATTR_NUM[a]] = v;
    }
  }
  for (const a in ATTR_BOOL)
    if (el.hasAttribute(a)) o[ATTR_BOOL[a]] = asBool(el.getAttribute(a));
  for (const a in ATTR_COLOR)
    if (el.hasAttribute(a)) o[ATTR_COLOR[a]] = parseHexObj(el.getAttribute(a));
  if (el.hasAttribute('gradientMode')) o.gradientMode = el.getAttribute('gradientMode');
  if (el.hasAttribute('triangleType')) o.triangleType = el.getAttribute('triangleType');
  if (el.hasAttribute('angleLock'))    o.angleLockMode = el.getAttribute('angleLock');
  const connEl = Array.from(el.children).find(c => c.tagName.toLowerCase() === 'connector');
  if (connEl) {
    const cd = {};
    const map = { localX:'localX', localY:'localY', percent:'percent',
      percentDefault:'percentDefault', value:'value',
      ancestralValue:'smartStretchAncestralValue', end:'endNodeDrawIndex' };
    for (const a in map)
      if (connEl.hasAttribute(a)) cd[map[a]] = parseFloat(connEl.getAttribute(a));
    if (connEl.hasAttribute('method')) cd.method = connEl.getAttribute('method');
    if (connEl.hasAttribute('reversed')) cd.reversed = asBool(connEl.getAttribute('reversed'));
    o.connectorData = cd;
  }
  return o;
}

function polyfillOptionsFromEl(el) {
  return {
    anchor: parseInt(el.getAttribute('anchor') || '0', 10),
    colorHex: el.getAttribute('color') || '#000000FF',
    useColor: el.hasAttribute('useColor') ? asBool(el.getAttribute('useColor')) : true,
    attached: (el.getAttribute('attached') || '').split(',')
      .map(s => s.trim()).filter(Boolean).map(Number),
  };
}

function buildFigure(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  const perr = doc.querySelector('parsererror');
  if (perr) throw new Error('XML parse error: ' + perr.textContent.trim());
  const rootEl = doc.documentElement;
  if (rootEl.tagName.toLowerCase() !== 'stickfigure')
    throw new Error('root element must be <stickfigure>');
  const fig = new mod.Stickfigure();
  if (rootEl.hasAttribute('version')) fig.setVersion(parseInt(rootEl.getAttribute('version'), 10));
  if (rootEl.hasAttribute('build'))   fig.build = parseInt(rootEl.getAttribute('build'), 10);
  if (rootEl.hasAttribute('scale'))   fig.scale = parseFloat(rootEl.getAttribute('scale'));
  if (rootEl.hasAttribute('color'))   fig.colorHex = rootEl.getAttribute('color');
  const rootNode = fig.rootNode();
  let added = 0;
  const walk = (parent, containerEl) => {
    for (const el of containerEl.children) {
      if (el.tagName.toLowerCase() !== 'node') continue;
      const child = parent.addChild(nodeOptionsFromEl(el));
      added++;
      walk(child, el);
    }
  };
  walk(rootNode, rootEl);
  let pfAdded = 0;
  for (const el of rootEl.children) {
    if (el.tagName.toLowerCase() !== 'polyfill') continue;
    try { fig.addPolyfill(polyfillOptionsFromEl(el)); pfAdded++; }
    catch (e) { logMsg('err', 'polyfill skipped: ' + (e.message || e)); }
  }
  return { fig, added, pfAdded };
}

/* ══════════════════════════════════════════════════════════════════
   World walk. Applies figure.scale to each offset — matches how
   StickNodes' renderer scales the whole figure.
   ══════════════════════════════════════════════════════════════════ */
function walkWorld(fig) {
  const out = [];
  const figScale = fig.scale || 1;
  const visit = (node, sx, sy, parentAngle) => {
    const ga = parentAngle + (node.localAngle || 0);
    const rad = ga * Math.PI / 180;
    const len = node.length || 0;
    const sf = node.useSegmentScale ? (node.scale || 1) : 1;
    const ex = sx + len * Math.cos(rad) * sf * figScale;
    const ey = sy + len * Math.sin(rad) * sf * figScale;
    out.push({ node, sx, sy, ex, ey, angle: ga });
    for (const k of node.children()) visit(k, ex, ey, ga);
  };
  visit(fig.rootNode(), 0, 0, 0);
  return out;
}

/* ══════════════════════════════════════════════════════════════════
   Robust bbox: collects all node endpoints, trims extreme 2% when
   trimFit is on, then pads by half thickness (not length!).
   ══════════════════════════════════════════════════════════════════ */
function computeBBox(items) {
  if (items.length === 0) return { minX:-60, minY:-60, maxX:60, maxY:60 };
  const pts = [];
  let maxPad = 0;
  for (const it of items) {
    const th = Math.abs(it.node.thickness || 0);
    const pad = th / 2;
    if (pad > maxPad) maxPad = pad;
    pts.push([it.sx, it.sy, pad]);
    pts.push([it.ex, it.ey, pad]);
  }
  let minX, minY, maxX, maxY;
  if (trimFit && pts.length >= 20) {
    const xs = pts.map(p => p[0]).sort((a,b) => a-b);
    const ys = pts.map(p => p[1]).sort((a,b) => a-b);
    const trimFrac = 0.02;
    const loX = Math.floor(xs.length * trimFrac);
    const hiX = Math.ceil(xs.length * (1 - trimFrac)) - 1;
    const loY = Math.floor(ys.length * trimFrac);
    const hiY = Math.ceil(ys.length * (1 - trimFrac)) - 1;
    minX = xs[loX]; maxX = xs[hiX];
    minY = ys[loY]; maxY = ys[hiY];
  } else {
    minX = Infinity; minY = Infinity; maxX = -Infinity; maxY = -Infinity;
    for (const p of pts) {
      if (p[0] < minX) minX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] > maxY) maxY = p[1];
    }
  }
  const pad = Math.max(maxPad, 6) + 6;
  return { minX: minX - pad, minY: minY - pad, maxX: maxX + pad, maxY: maxY + pad };
}

function render(fig) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const items = walkWorld(fig);
  const bb = computeBBox(items);
  const spanX = Math.max(bb.maxX - bb.minX, 40);
  const spanY = Math.max(bb.maxY - bb.minY, 40);
  const fit = Math.min((W - 40) / spanX, (H - 40) / spanY);
  const cx = (bb.minX + bb.maxX) / 2, cy = (bb.minY + bb.maxY) / 2;

  // Light grid
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(fit, flipY ? -fit : fit);
  ctx.translate(-cx, -cy);

  ctx.strokeStyle = 'rgba(0,0,0,0.045)';
  ctx.lineWidth = 1 / fit;
  const step = 50;
  const gx0 = Math.floor(bb.minX / step) * step, gx1 = Math.ceil(bb.maxX / step) * step;
  const gy0 = Math.floor(bb.minY / step) * step, gy1 = Math.ceil(bb.maxY / step) * step;
  for (let gx = gx0; gx <= gx1; gx += step) {
    ctx.beginPath(); ctx.moveTo(gx, gy0); ctx.lineTo(gx, gy1); ctx.stroke();
  }
  for (let gy = gy0; gy <= gy1; gy += step) {
    ctx.beginPath(); ctx.moveTo(gx0, gy); ctx.lineTo(gx1, gy); ctx.stroke();
  }

  // Origin cross
  ctx.strokeStyle = 'rgba(79,70,229,0.14)';
  ctx.lineWidth = 1.4 / fit;
  ctx.beginPath();
  ctx.moveTo(gx0, 0); ctx.lineTo(gx1, 0);
  ctx.moveTo(0, gy0); ctx.lineTo(0, gy1);
  ctx.stroke();

  const osz = 6 / fit;
  ctx.fillStyle = 'rgba(79,70,229,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, osz, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(79,70,229,0.3)';
  ctx.lineWidth = 1.2 / fit;
  ctx.beginPath(); ctx.arc(0, 0, osz * 2.2, 0, Math.PI * 2); ctx.stroke();

  // Figure
  let figCol;
  try { figCol = cssFromHex(fig.colorHex); } catch { figCol = 'rgba(32,32,32,1)'; }

  for (const it of items) {
    const n = it.node;
    if (n.nodeType === -1) continue;
    let col = figCol;
    if (n.useSegmentColor) {
      try { col = cssFromHex(n.colorHex); } catch {}
    }
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const th = Math.max(0.3, Math.abs(n.thickness || 1));
    const ln = Math.max(0.3, Math.abs(n.length || 0));
    const angle = Math.atan2(it.ey - it.sy, it.ex - it.sx);

    switch (n.nodeType) {
      case 1:
      case 0:
        ctx.lineWidth = th;
        ctx.lineCap = n.nodeType === 0 ? 'round' : 'butt';
        ctx.beginPath();
        ctx.moveTo(it.sx, it.sy);
        ctx.lineTo(it.ex, it.ey);
        ctx.stroke();
        break;
      case 2:
      case 4: {
        const d = Math.max(ln, th);
        const r = d / 2;
        ctx.beginPath();
        ctx.arc(it.ex, it.ey, r, 0, Math.PI * 2);
        if (n.nodeType === 4) ctx.fill();
        else { ctx.lineWidth = Math.max(0.4, th); ctx.stroke(); }
        break;
      }
      case 5:
        ctx.save();
        ctx.translate(it.ex, it.ey);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, ln / 2, Math.max(0.3, th / 2), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      case 3: {
        const r = ln;
        const base = angle + Math.PI;
        const side = 2 * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(it.ex, it.ey);
        ctx.lineTo(it.ex + r * Math.cos(base + side / 2),
                   it.ey + r * Math.sin(base + side / 2));
        ctx.lineTo(it.ex + r * Math.cos(base - side / 2),
                   it.ey + r * Math.sin(base - side / 2));
        ctx.closePath();
        ctx.fill();
        break;
      }
      case 6: {
        const w1 = Math.abs(n.trapezoidThicknessStart ?? th) || th;
        const w2 = Math.abs(n.trapezoidThicknessEnd   ?? th * 0.5) || th * 0.5;
        const nx = -Math.sin(angle), ny = Math.cos(angle);
        ctx.beginPath();
        ctx.moveTo(it.sx + nx * w1 / 2, it.sy + ny * w1 / 2);
        ctx.lineTo(it.ex + nx * w2 / 2, it.ey + ny * w2 / 2);
        ctx.lineTo(it.ex - nx * w2 / 2, it.ey - ny * w2 / 2);
        ctx.lineTo(it.sx - nx * w1 / 2, it.sy - ny * w1 / 2);
        ctx.closePath();
        ctx.fill();
        break;
      }
      case 7: {
        const sides = Math.max(3, n.numPolygonVertices || 5);
        const r = ln;
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const a = angle + (i / sides) * Math.PI * 2;
          const px = it.ex + r * Math.cos(a);
          const py = it.ey + r * Math.sin(a);
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        break;
      }
    }
  }
  ctx.restore();

  previewMeta.textContent =
    '×' + fit.toFixed(2) + '  ·  ' + items.length + ' nodes' +
    (flipY ? '  ·  flipped' : '') +
    (trimFit ? '  ·  trim' : '');
}

function renderTree(fig) {
  treeEl.textContent = '';
  const visit = (node, depth) => {
    const row = document.createElement('div');
    row.className = 'row';
    const branch = document.createElement('span');
    branch.className = 'branch';
    branch.textContent = '│ '.repeat(Math.min(depth, 20));
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = '[' + node.drawIndex + ']';
    const type = document.createElement('span');
    type.className = 'type';
    type.textContent = NODE_TYPE_NAME[node.nodeType] || node.nodeType;
    const props = document.createElement('span');
    props.className = 'props';
    let s = '';
    if (node.length)     s += 'len=' + node.length.toFixed(1) + ' ';
    if (node.thickness)  s += 'th='  + node.thickness + ' ';
    if (node.localAngle) s += '∠'    + node.localAngle.toFixed(1) + '° ';
    if (node.useSegmentColor) { try { s += node.colorHex; } catch {} }
    props.textContent = s.trim();
    row.appendChild(branch); row.appendChild(idx);
    row.appendChild(type); row.appendChild(props);
    treeEl.appendChild(row);
    for (const k of node.children()) visit(k, depth + 1);
  };
  visit(fig.rootNode(), 0);
}

function figureToXml(fig) {
  const out = [];
  out.push('<?xml version="1.0"?>');
  out.push('<stickfigure version="' + fig.version + '" build="' + fig.build +
           '" scale="' + fig.scale + '" color="' + fig.colorHex + '">');
  const write = (node, depth) => {
    const pad = '  '.repeat(depth);
    const attrs = [];
    const t = NODE_TYPE_NAME[node.nodeType];
    if (t && t !== 'RootNode') attrs.push('type="' + t + '"');
    if (node.length)     attrs.push('length="' + node.length + '"');
    if (node.thickness)  attrs.push('thickness="' + node.thickness + '"');
    if (node.localAngle) attrs.push('angle="' + node.localAngle + '"');
    if (node.useSegmentColor) {
      try {
        attrs.push('color="' + node.colorHex + '"');
        attrs.push('useSegmentColor="true"');
      } catch {}
    }
    if (node.useSegmentScale) attrs.push('useSegmentScale="true"');
    const kids = node.children();
    const open = pad + '<node ' + attrs.join(' ');
    if (kids.length === 0) { out.push(open + '/>'); return; }
    out.push(open + '>');
    for (const k of kids) write(k, depth + 1);
    out.push(pad + '</node>');
  };
  for (const k of fig.rootNode().children()) write(k, 1);
  out.push('</stickfigure>');
  return out.join('\n');
}

let currentFig = null;

function updateXmlMeta() {
  const text = xmlEl.value;
  const lines = text.split('\n').length;
  const bytes = new Blob([text]).size;
  xmlMeta.textContent = lines + ' lines · ' + bytes + ' B';
}
xmlEl.addEventListener('input', updateXmlMeta);

function buildAndShow() {
  clearLog();
  try {
    const r = buildFigure(xmlEl.value);
    currentFig = r.fig;
    render(r.fig);
    renderTree(r.fig);
    logMsg('ok', 'Built ' + r.added + ' node(s)' +
        (r.pfAdded ? ' · ' + r.pfAdded + ' polyfill(s)' : ''));
    logMsg('dim', 'version=' + r.fig.version + ' · build=' + r.fig.build +
        ' · scale=' + r.fig.scale);
    toast('Built ' + r.added + ' node' + (r.added === 1 ? '' : 's'));
  } catch (e) {
    logMsg('err', e.message || String(e));
    document.querySelector('.tabs button[data-tab="log"]').click();
    toast('Build failed');
  }
}

$('btnBuild').addEventListener('click', buildAndShow);

$('btnDownload').addEventListener('click', () => {
  try {
    if (!currentFig) buildAndShow();
    if (!currentFig) return;
    const bytes = currentFig.toBytes();
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'figure.nodes';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    logMsg('ok', 'Exported ' + bytes.length.toLocaleString() + ' bytes');
    toast('Downloaded figure.nodes');
  } catch (e) {
    logMsg('err', e.message || String(e));
    toast('Export failed');
  }
});

$('btnExport').addEventListener('click', () => {
  try {
    if (!currentFig) buildAndShow();
    if (!currentFig) return;
    xmlEl.value = figureToXml(currentFig);
    updateXmlMeta();
    logMsg('ok', 'XML written from figure');
    toast('XML exported');
  } catch (e) { logMsg('err', e.message || String(e)); }
});

$('btnCopy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(xmlEl.value);
    toast('Copied to clipboard');
  } catch (e) {
    xmlEl.focus();
    xmlEl.select();
    toast('Select-all — press Ctrl/Cmd+C');
  }
});

$('btnLoad').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const fig = mod.Stickfigure.fromBytes(buf);
    currentFig = fig;
    render(fig);
    renderTree(fig);
    xmlEl.value = figureToXml(fig);
    updateXmlMeta();
    logMsg('ok', 'Loaded ' + file.name + ' · ' + buf.length.toLocaleString() +
        ' bytes · v' + fig.version + ' b' + fig.build);
    toast('Loaded ' + file.name);
  } catch (e) {
    logMsg('err', 'load: ' + (e.message || String(e)));
    toast('Load failed');
  } finally { fileInput.value = ''; }
});

$('btnFlip').addEventListener('click', () => {
  flipY = !flipY;
  $('btnFlip').classList.toggle('on', flipY);
  if (currentFig) render(currentFig);
  toast('Preview Y-flip: ' + (flipY ? 'ON' : 'OFF'));
});

$('btnFit').addEventListener('click', () => {
  trimFit = !trimFit;
  $('btnFit').classList.toggle('on', trimFit);
  if (currentFig) render(currentFig);
  toast('Trim outliers: ' + (trimFit ? 'ON' : 'OFF'));
});

$('preset').addEventListener('change', e => {
  const key = e.target.value;
  if (!key) return;
  xmlEl.value = PRESETS[key] || PRESETS.standing;
  updateXmlMeta();
  buildAndShow();
  e.target.value = '';
});

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector('.tab-content[data-tab="' + btn.dataset.tab + '"]')
            .classList.add('active');
  });
});

(async () => {
  try {
    await loadLibrary();
    xmlEl.value = PRESETS.standing;
    updateXmlMeta();
    buildAndShow();
  } catch (e) {}
})();

window.addEventListener('resize', () => { if (currentFig) render(currentFig); });
