<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StickNodes Web Editor</title>
<style>
  :root {
    --bg:#f4f6fa; --panel:#fff; --panel-2:#fbfcfe;
    --border:#e3e6ec; --border-strong:#cfd4dd;
    --text:#1a1d24; --muted:#6b7280; --muted-2:#9ca3af;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff;
    --ok:#059669; --ok-soft:#ecfdf5;
    --err:#dc2626; --err-soft:#fef2f2;
    --warn:#d97706; --warn-soft:#fffbeb;
    --radius:10px; --radius-sm:6px;
    --shadow-sm:0 1px 2px rgba(20,20,40,.05);
    --shadow:0 1px 3px rgba(20,20,40,.08),0 4px 12px rgba(20,20,40,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* ── Header ── */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);flex:0 0 auto;
  }
  header .brand{display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:15px;letter-spacing:-.01em}
  header .brand .dot{width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 0 0 3px var(--accent-soft)}
  header .status{display:flex;align-items:center;gap:7px;font-size:12px;
    color:var(--muted);padding:5px 11px;background:var(--bg);
    border-radius:20px;border:1px solid var(--border)}
  header .status .led{width:6px;height:6px;border-radius:50%;
    background:var(--muted-2);transition:background .2s}
  header .status.ready .led{background:var(--ok);
    box-shadow:0 0 6px rgba(5,150,105,.5)}
  header .status.error .led{background:var(--err)}

  /* ── Toolbar ── */
  .toolbar{
    display:flex;align-items:center;gap:6px;padding:8px 16px;
    background:var(--panel);border-bottom:1px solid var(--border);
    flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
  }
  .toolbar::-webkit-scrollbar{display:none}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 12px;font:inherit;font-weight:500;font-size:12.5px;
    color:var(--text);background:var(--panel);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    cursor:pointer;white-space:nowrap;min-height:36px;
    transition:all .12s ease;box-shadow:var(--shadow-sm);
  }
  .btn:hover{background:#fafbfd;border-color:#b6bcc7}
  .btn:active{transform:translateY(1px);box-shadow:none}
  .btn.primary{
    background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 1px 3px rgba(79,70,229,.3),0 4px 12px rgba(79,70,229,.15);
  }
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.toggle.on{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent);
  }
  .btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sep{width:1px;height:24px;background:var(--border);margin:0 2px;flex:0 0 auto}
  select.preset{
    font:inherit;font-size:12.5px;font-weight:500;padding:8px 10px;
    background:var(--panel);border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);cursor:pointer;min-height:36px;
    color:var(--text);box-shadow:var(--shadow-sm);
  }
  .spacer{flex:1}

  /* ── Main ── */
  .main{
    flex:1 1 auto;display:grid;
    grid-template-columns:minmax(0,1fr) 420px;
    gap:10px;padding:10px 16px 14px;min-height:0;
  }
  @media(max-width:900px){
    .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 400px}
  }

  /* ── Canvas card ── */
  .canvas-card{
    position:relative;background:var(--panel);
    border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;min-height:0;
  }
  .canvas-wrap{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#f8fafc 0%,#eef2f7 100%);
    touch-action:none;user-select:none;cursor:grab;overflow:hidden;
  }
  .canvas-wrap.grabbing{cursor:grabbing}
  canvas{display:block;width:100%;height:100%;background:#fff}

  /* zoom controls */
  .zoom-controls{
    position:absolute;top:10px;right:10px;
    display:flex;flex-direction:column;gap:3px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:8px;
    padding:4px;box-shadow:var(--shadow);
  }
  .zoom-controls button{
    width:32px;height:32px;border:0;border-radius:6px;
    background:transparent;color:var(--text);
    font-size:16px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .1s;
  }
  .zoom-controls button:hover{background:var(--accent-soft);color:var(--accent)}
  .zoom-controls svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .zoom-controls .pct{
    font:600 10px/1 ui-monospace,Consolas,monospace;
    color:var(--muted);text-align:center;padding:4px 0;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  }

  .canvas-status{
    position:absolute;left:10px;bottom:10px;
    padding:6px 11px;border:1px solid var(--border);
    border-radius:8px;background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--muted);font-size:11.5px;font-weight:500;
    pointer-events:none;box-shadow:var(--shadow-sm);
    max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;
  }
  .canvas-status.err{color:var(--err);border-color:#fccac0;background:var(--err-soft)}

  /* ── Panel ── */
  .panel{
    display:flex;flex-direction:column;min-height:0;gap:10px;
  }
  .card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 12px;border-bottom:1px solid var(--border);
    background:var(--panel-2);flex:0 0 auto;
  }
  .card-head h2{
    margin:0;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  }
  .card-head .meta{
    font-size:10.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }

  textarea{
    flex:1 1 auto;min-height:0;width:100%;
    border:0;outline:0;resize:none;
    padding:12px 14px;
    background:var(--panel);color:var(--text);
    font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
    tab-size:2;
  }
  textarea::selection{background:var(--accent-soft)}

  /* actions row */
  .actions{
    display:grid;grid-template-columns:1fr 1fr;
    gap:6px;padding:8px;border-top:1px solid var(--border);
    background:var(--panel-2);
  }
  .actions .btn{justify-content:center;min-height:34px;font-size:12px}

  /* tree */
  .tree-wrap{
    flex:0 0 auto;height:200px;min-height:120px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .tree-wrap .tree-scroll{
    flex:1 1 auto;overflow:auto;padding:6px;
  }
  .tree-row{
    display:flex;align-items:center;gap:8px;
    padding:5px 8px;border-radius:5px;
    font:11.5px/1.4 ui-monospace,Consolas,monospace;
    color:#374151;cursor:pointer;
    border:1px solid transparent;
  }
  .tree-row:hover{background:#f3f5f9}
  .tree-row.selected{
    background:var(--accent-soft);color:var(--accent);
    border-color:#c7d2fe;
  }
  .tree-row.polyfill{color:#047857}
  .tree-row .idx{
    color:var(--accent);font-weight:700;min-width:34px;
  }
  .tree-row.selected .idx{color:var(--accent-hover)}
  .tree-row .type{color:#b45309;font-weight:500;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* hide file input */
  input[type=file]{display:none}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:24px;
    transform:translateX(-50%) translateY(80px);
    background:#1a1d24;color:#fff;padding:10px 18px;
    border-radius:24px;font-size:13px;font-weight:500;
    box-shadow:0 12px 32px rgba(20,20,40,.18);
    opacity:0;pointer-events:none;z-index:100;
    transition:all .25s cubic-bezier(.2,.8,.2,1);
    max-width:80vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:560px){
    .toolbar .btn .label{display:none}
    .toolbar .btn{padding:8px 10px}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="dot"></span>StickNodes Web Editor</div>
    <div class="status" id="status"><span class="led"></span><span id="statusText">Loading…</span></div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="build">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
      <span class="label">Build JSON</span>
    </button>
    <button class="btn" id="downloadNodes">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      <span class="label">Download .nodes</span>
    </button>

    <div class="sep"></div>

    <button class="btn" id="load">
      <svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M12 11v6m0 0l-3-3m3 3l3-3"/></svg>
      <span class="label">Load</span>
    </button>
    <button class="btn" id="copyJson">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
      <span class="label">Copy</span>
    </button>
    <button class="btn" id="formatJson">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span class="label">Format</span>
    </button>

    <div class="sep"></div>

    <button class="btn toggle on" id="drag" title="Enable node dragging">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M4 12h16M7 8l-3 4 3 4M17 8l3 4-3 4"/></svg>
      <span class="label">Drag</span>
    </button>
    <button class="btn toggle on" id="fills" title="Render polyfill fills">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9-9 9z"/></svg>
      <span class="label">Fills</span>
    </button>
    <button class="btn toggle on" id="points" title="Show all node handles">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" opacity=".5"/></svg>
      <span class="label">Points</span>
    </button>
    <button class="btn toggle on" id="limbPoints" title="Only show handles for limb nodes">
      <svg viewBox="0 0 24 24"><path d="M6 6l6 12 6-12"/></svg>
      <span class="label">Limb only</span>
    </button>
    <button class="btn toggle" id="flip" title="Flip Y in preview">
      <svg viewBox="0 0 24 24"><path d="M12 3v18M4 12h16M7 8l-3 4 3 4M17 8l3 4-3 4"/></svg>
      <span class="label">Flip</span>
    </button>

    <div class="sep"></div>

    <button class="btn" id="zoomOut" title="Zoom out">−</button>
    <button class="btn" id="zoomIn" title="Zoom in">+</button>
    <button class="btn" id="zoomReset" title="Reset zoom">⌂</button>

    <div class="spacer"></div>

    <select class="preset" id="preset">
      <option value="">Preset…</option>
      <option value="standing">Standing</option>
      <option value="simple">Simple</option>
      <option value="stickman">Stickman</option>
    </select>

    <input id="file" type="file" accept=".nodes,.json,application/json,application/octet-stream">
  </div>

  <div class="main">

    <!-- Canvas -->
    <div class="canvas-card">
      <div class="canvas-wrap" id="viewport">
        <canvas id="canvas"></canvas>
        <div class="zoom-controls">
          <button id="zoomIn2" title="Zoom in">+</button>
          <div class="pct" id="zoomPct">100%</div>
          <button id="zoomOut2" title="Zoom out">−</button>
          <button id="zoomReset2" title="Fit view">
            <svg viewBox="0 0 24 24"><path d="M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6"/></svg>
          </button>
        </div>
        <div class="canvas-status" id="status2">Loading…</div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="panel">

      <div class="card" style="flex:1 1 55%">
        <div class="card-head">
          <h2>Figure JSON</h2>
          <span class="meta" id="jsonMeta">-</span>
        </div>
        <textarea id="json" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="off"></textarea>
        <div class="actions">
          <button class="btn primary" id="applyJson">Apply</button>
          <button class="btn" id="prettyJson">Pretty</button>
          <button class="btn" id="copyJson2">Copy</button>
          <button class="btn" id="resetJson">Reset</button>
        </div>
      </div>

      <div class="card tree-wrap" style="flex:1 1 45%">
        <div class="card-head">
          <h2>Node Tree</h2>
          <span class="meta" id="treeMeta">0 nodes</span>
        </div>
        <div class="tree-scroll" id="tree"></div>
      </div>

    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import {
  StickNodesRenderer,
  figureToJSON,
  jsonStringifyFigure,
  jsonToFigure,
} from "./ren.js";

/* ── DOM refs ────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const canvas    = $("canvas");
const viewport  = $("viewport");
const jsonBox   = $("json");
const treeEl    = $("tree");
const statusEl  = $("status");
const statusTxt = $("statusText");
const status2   = $("status2");
const toastEl   = $("toast");
const fileInput = $("file");

/* ── Status / log helpers ───────────────────────────────────────── */
function setStatus(text, kind = "") {
  statusTxt.textContent = text;
  statusEl.className = "status " + kind;
  status2.textContent = text;
  status2.className = "canvas-status " + (kind === "error" ? "err" : "");
}
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

/* ── Type map ────────────────────────────────────────────────────── */
const TYPE_NAME = {
  0:"RoundedSegment", 1:"Segment", 2:"Circle", 3:"Triangle",
  4:"FilledCircle", 5:"Ellipse", 6:"Trapezoid", 7:"Polygon"
};

/* ── State ───────────────────────────────────────────────────────── */
let mod = null;
let figure = null;
let renderer = null;
let selectedNodeIndex = -1;

/* ── JSON <-> Figure ─────────────────────────────────────────────── */
function updateJSON() {
  if (!figure) { jsonBox.value = ""; return; }
  try {
    jsonBox.value = jsonStringifyFigure(figure, 2);
  } catch (e) {
    console.error("serialize failed:", e);
    try { jsonBox.value = JSON.stringify(figureToJSON(figure), null, 2); } catch (_) {}
  }
  updateJsonMeta();
}
function updateJsonMeta() {
  const t = jsonBox.value;
  $("jsonMeta").textContent =
    t.split("\n").length + " lines · " + new Blob([t]).size + " B";
}
jsonBox.addEventListener("input", updateJsonMeta);

/* ── Tree ────────────────────────────────────────────────────────── */
function updateTree() {
  treeEl.innerHTML = "";
  if (!figure) {
    $("treeMeta").textContent = "0 nodes";
    return;
  }
  let nodes = [];
  try { nodes = figure.allNodes?.() || []; } catch (_) {}
  for (const node of nodes) {
    let idx = -1, type = -1;
    try { idx = node.drawIndex; } catch (_) {}
    try { type = node.nodeType; } catch (_) {}

    const row = document.createElement("div");
    row.className = "tree-row";
    row.innerHTML =
      `<span class="idx">[${idx}]</span>` +
      `<span class="type">${TYPE_NAME[type] || ("Type" + type)}</span>`;
    if (idx === selectedNodeIndex) row.classList.add("selected");

    row.onclick = () => {
      selectedNodeIndex = idx;
      try { renderer?.setSelectedNode?.(idx); } catch (_) {}
      updateTree();
      render();
    };
    treeEl.appendChild(row);
  }
  let pfCount = 0;
  try { pfCount = (figure.allPolyfills?.() || []).length; } catch (_) {}
  $("treeMeta").textContent =
    nodes.length + " nodes · " + pfCount + " polyfills";
}

/* ── Render ──────────────────────────────────────────────────────── */
function render() {
  if (!renderer || !figure) return;
  try { renderer.setFigure?.(figure); } catch (_) {}
  try { renderer.render?.(); } catch (e) {
    console.error("renderer error:", e);
    setStatus("Render error: " + e.message, "error");
  }
  try {
    const z = renderer.view?.zoom || 1;
    $("zoomPct").textContent = Math.round(z * 100) + "%";
  } catch (_) {}
}

/* ── Apply figure ────────────────────────────────────────────────── */
function setFigure(newFigure) {
  if (!newFigure) throw new Error("Invalid figure");
  figure = newFigure;
  selectedNodeIndex = -1;
  try { renderer.setFigure?.(figure); } catch (_) {}
  updateJSON();
  updateTree();
  render();
  setStatus("Figure loaded", "ready");
}

/* ── JSON build ──────────────────────────────────────────────────── */
function applyJSON() {
  const text = jsonBox.value.trim();
  if (!text) { alert("JSON is empty."); return; }
  try {
    const data = JSON.parse(text);
    const newFigure = jsonToFigure(data, mod.Stickfigure);
    setFigure(newFigure);
    toast("Built from JSON");
  } catch (e) {
    console.error(e);
    setStatus("Build failed: " + e.message, "error");
    alert("Could not build figure from JSON:\n\n" + e.message);
  }
}

/* ── Load ────────────────────────────────────────────────────────── */
$("load").onclick = () => fileInput.click();
fileInput.onchange = async (ev) => {
  const f = ev.target.files?.[0];
  if (!f) return;
  try {
    const name = f.name.toLowerCase();
    if (name.endsWith(".json")) {
      jsonBox.value = await f.text();
      updateJsonMeta();
      applyJSON();
      return;
    }
    const bytes = new Uint8Array(await f.arrayBuffer());
    if (!mod?.Stickfigure) throw new Error("WASM not loaded");
    const loaded = mod.Stickfigure.fromBytes(bytes);
    try { loaded.setNodeLimitEnabled(false); } catch (_) {}
    setFigure(loaded);
    setStatus(`Loaded ${f.name}`, "ready");
    toast("Loaded " + f.name);
  } catch (e) {
    console.error(e);
    setStatus("Load failed: " + e.message, "error");
    alert("Could not load file:\n\n" + e.message);
  } finally {
    ev.target.value = "";
  }
};

/* ── Download ────────────────────────────────────────────────────── */
$("downloadNodes").onclick = () => {
  if (!figure) { alert("No figure loaded."); return; }
  try {
    const bytes = figure.toBytes();
    const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    const blob = new Blob([u8], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "stickfigure.nodes";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus(`Downloaded ${u8.length} bytes`, "ready");
    toast("Downloaded .nodes");
  } catch (e) {
    console.error(e);
    setStatus("Export failed: " + e.message, "error");
  }
};

/* ── Build / Apply / Format / Copy ───────────────────────────────── */
$("build").onclick = applyJSON;
$("applyJson").onclick = applyJSON;

function formatJSON() {
  try {
    jsonBox.value = JSON.stringify(JSON.parse(jsonBox.value), null, 2);
    updateJsonMeta();
  } catch (e) { alert("Invalid JSON:\n\n" + e.message); }
}
$("formatJson").onclick = formatJSON;
$("prettyJson").onclick = formatJSON;

async function copyJSON() {
  try { await navigator.clipboard.writeText(jsonBox.value); toast("Copied"); }
  catch (_) { jsonBox.focus(); jsonBox.select(); document.execCommand("copy"); toast("Copied"); }
}
$("copyJson").onclick = copyJSON;
$("copyJson2").onclick = copyJSON;

$("resetJson").onclick = () => {
  jsonBox.value = JSON.stringify(PRESETS.standing, null, 2);
  updateJsonMeta();
  applyJSON();
};

/* ── Renderer toggles ────────────────────────────────────────────── */
$("drag").onclick = function () {
  this.classList.toggle("on");
  renderer?.setDragEnabled?.(this.classList.contains("on"));
  toast("Drag: " + (this.classList.contains("on") ? "ON" : "OFF"));
};
$("fills").onclick = function () {
  this.classList.toggle("on");
  renderer?.setFills?.(this.classList.contains("on"));
  render();
  toast("Fills: " + (this.classList.contains("on") ? "ON" : "OFF"));
};
$("points").onclick = function () {
  this.classList.toggle("on");
  renderer?.setShowPoints?.(this.classList.contains("on"));
  render();
};
$("limbPoints").onclick = function () {
  this.classList.toggle("on");
  renderer?.setShowLimbPointsOnly?.(this.classList.contains("on"));
  render();
};
$("flip").onclick = function () {
  this.classList.toggle("on");
  renderer?.setFlipY?.(this.classList.contains("on"));
  render();
  toast("Flip Y: " + (this.classList.contains("on") ? "ON" : "OFF"));
};

/* ── Zoom ────────────────────────────────────────────────────────── */
function doZoom(f) {
  renderer?.zoomBy?.(f);
  render();
}
$("zoomIn").onclick     = () => doZoom(1.25);
$("zoomOut").onclick    = () => doZoom(1 / 1.25);
$("zoomReset").onclick  = () => { renderer?.fitView?.(); render(); };

/* ── WASM init ──────────────────────────────────────────────────── */
async function initWasm() {
  setStatus("Loading WASM…");

  // Try direct import, fall back to blob URL (Android HTTP servers
  // serve .js with the wrong MIME).
  try {
    mod = await import("./sticknodes_rs.js");
  } catch (e) {
    const jsText = await (await fetch("./sticknodes_rs.js", { cache: "no-store" })).text();
    const blobUrl = URL.createObjectURL(new Blob([jsText], { type: "application/javascript" }));
    try { mod = await import(blobUrl); }
    finally { URL.revokeObjectURL(blobUrl); }
  }

  const wasmBytes = await (await fetch("./sticknodes_rs_bg.wasm", { cache: "no-store" })).arrayBuffer();
  if (typeof mod.default === "function") await mod.default(wasmBytes);
  else if (typeof mod.init === "function") await mod.init(wasmBytes);

  // Create renderer
  renderer = new StickNodesRenderer(canvas);
  renderer.setFills(true);
  renderer.setShowPoints(true);
  renderer.setShowLimbPointsOnly(true);
  renderer.setDragEnabled(true);
  renderer.setFlipY(false);

  // Set initial preset
  jsonBox.value = JSON.stringify(PRESETS.standing, null, 2);
  updateJsonMeta();

  try {
    const fig = jsonToFigure(PRESETS.standing, mod.Stickfigure);
    setFigure(fig);
  } catch (e) {
    console.error("Default figure failed:", e);
    setStatus("WASM loaded - waiting for figure", "error");
    return;
  }

  setStatus("Ready", "ready");
}

/* ── Keyboard shortcuts ─────────────────────────────────────────── */
window.addEventListener("keydown", (ev) => {
  if (document.activeElement === jsonBox) return;
  if (ev.ctrlKey && ev.key.toLowerCase() === "s") {
    ev.preventDefault(); $("downloadNodes").click(); return;
  }
  if (ev.key === "+" || ev.key === "=") { doZoom(1.15); }
  else if (ev.key === "-" || ev.key === "_") { doZoom(1 / 1.15); }
  else if (ev.key === "0") { renderer?.fitView?.(); render(); }
});

/* ── Start ──────────────────────────────────────────────────────── */
initWasm().catch((err) => {
  console.error("Init failed:", err);
  setStatus("Initialization failed: " + err.message, "error");
  alert("StickNodes WASM failed to initialize.\n\n" + err.message);
});
