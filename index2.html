<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>StickNodes Studio</title>
<style>
  :root {
    --bg:#f4f6fa; --panel:#fff; --border:#e3e6ec; --border-strong:#cfd4dd;
    --text:#1a1d24; --muted:#6b7280;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-soft:#eef2ff;
    --ok:#059669; --err:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text)}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{display:flex;align-items:center;justify-content:space-between;
    padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
  header .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  header .brand .dot{width:9px;height:9px;border-radius:50%;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 0 0 3px var(--accent-soft)}
  header .status{font-size:11px;color:var(--muted);
    padding:4px 10px;background:var(--bg);border-radius:14px;border:1px solid var(--border)}
  header .status.ready{color:var(--ok)}

  .toolbar{display:flex;gap:6px;padding:8px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);overflow-x:auto}
  .toolbar::-webkit-scrollbar{display:none}
  .btn{padding:7px 12px;font:inherit;font-weight:500;font-size:12px;
    color:var(--text);background:var(--panel);border:1px solid var(--border-strong);
    border-radius:6px;cursor:pointer;white-space:nowrap;min-height:34px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  select.preset{font:inherit;font-size:12px;padding:7px 10px;background:var(--panel);
    border:1px solid var(--border-strong);border-radius:6px;cursor:pointer}
  .spacer{flex:1}

  .content{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;
    gap:10px;padding:10px 16px 14px;min-height:0}
  @media(max-width:900px){.content{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card-head{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--border);background:#fbfcfe}
  .card-head h2{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted)}
  .card-head .meta{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}

  .canvas-wrap{flex:1 1 auto;min-height:0;overflow:hidden;background:#fbfcfe;
    touch-action:none;user-select:none;position:relative}
  canvas{display:block;width:100%;height:100%;background:#fff}

  .tabs{display:flex;padding:5px 8px 0;background:#fbfcfe;border-bottom:1px solid var(--border)}
  .tabs button{padding:8px 12px;font:inherit;font-size:11.5px;font-weight:600;
    color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;
    cursor:pointer;border-radius:4px 4px 0 0}
  .tabs button.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
  .tab-content{flex:1 1 auto;min-height:0;overflow:auto;display:none;background:var(--panel)}
  .tab-content.active{display:block}

  textarea{width:100%;height:100%;border:0;outline:0;resize:none;padding:12px;
    font:12px/1.55 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--text)}
  #log,#tree{padding:10px 12px;margin:0;font:11px/1.55 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word}
  #log .ok{color:var(--ok)} #log .err{color:var(--err)} #log .hi{color:var(--accent)}
  #log .dim{color:var(--muted)}

  #tree .row{display:grid;grid-template-columns:auto 40px 130px 14px 1fr;gap:6px;
    padding:2px 4px;white-space:nowrap;border-radius:4px;cursor:pointer;align-items:center}
  #tree .row:hover{background:#f7f8fb}
  #tree .branch{color:#d1d5db}
  #tree .idx{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
  #tree .type{color:#b45309;font-weight:500}
  #tree .swatch{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.1)}
  #tree .props{color:var(--muted);overflow:hidden;text-overflow:ellipsis}

  input[type=file]{display:none}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(60px);
    background:#1a1d24;color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
    opacity:0;transition:all .22s;pointer-events:none;z-index:100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="dot"></span>StickNodes Studio</div>
    <div class="status" id="status">loading…</div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnBuild">Build</button>
    <button class="btn" id="btnDownload">Download</button>
    <button class="btn" id="btnExport">→ XML</button>
    <button class="btn" id="btnCopy">Copy</button>
    <button class="btn" id="btnLoad">Load</button>
    <button class="btn on" id="btnDrag" title="Toggle node dragging">Drag</button>
    <button class="btn on" id="btnFills" title="Toggle polyfill fills">Fills</button>
    <div class="spacer"></div>
    <select class="preset" id="preset">
      <option value="">Preset…</option>
      <option value="empty">Empty</option>
      <option value="standing">Standing</option>
      <option value="tpose">T-pose</option>
      <option value="running">Running</option>
      <option value="sitting">Sitting</option>
      <option value="waving">Waving</option>
    </select>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-head">
        <h2>Preview</h2>
        <span class="meta" id="previewMeta">—</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="preview"></canvas>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;min-height:0;gap:10px">
      <div class="card" style="flex:1 1 50%">
        <div class="card-head">
          <h2>XML</h2>
          <span class="meta" id="xmlMeta">—</span>
        </div>
        <textarea id="xml" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
      </div>
      <div class="card" style="flex:1 1 50%;display:flex;flex-direction:column;min-height:0">
        <div class="tabs">
          <button data-tab="log" class="active">Log</button>
          <button data-tab="tree">Tree</button>
        </div>
        <div class="tab-content active" data-tab="log"><pre id="log"></pre></div>
        <div class="tab-content" data-tab="tree"><div id="tree"></div></div>
      </div>
    </div>
  </div>

</div>
<input type="file" id="fileInput">
<div id="toast"></div>

<script type="module">
import { StickNodesRenderer } from './renderer.js';

/* ───── DOM ───── */
const $ = id => document.getElementById(id);
const canvas = $('preview'), wrap = $('canvasWrap');
const logEl = $('log'), treeEl = $('tree'), xmlEl = $('xml');
const fileInput = $('fileInput'), toastEl = $('toast'), statusEl = $('status');

let toastTimer=null;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800);}
function log(kind,m){
  const cls={ok:'ok',err:'err',hi:'hi',dim:'dim'}[kind]||'dim';
  const line=document.createElement('div');line.className=cls;
  line.textContent=(kind==='ok'?'✔ ':kind==='err'?'✘ ':'')+m;
  logEl.appendChild(line);logEl.scrollTop=logEl.scrollHeight;
}
const clearLog=()=>{logEl.textContent='';};
function setStatus(s,t){statusEl.className='status '+(s||'');statusEl.textContent=t;}

/* ───── WASM load (MIME bypass) ───── */
let mod=null;
try{
  const jsText=await(await fetch('./sticknodes_rs.js',{cache:'no-store'})).text();
  const blobUrl=URL.createObjectURL(new Blob([jsText],{type:'application/javascript'}));
  mod=await import(blobUrl);
  URL.revokeObjectURL(blobUrl);
  log('ok','module loaded');
}catch(e){log('err','load module: '+e.message);throw e;}

try{
  const wasmBytes=await(await fetch('./sticknodes_rs_bg.wasm',{cache:'no-store'})).arrayBuffer();
  await mod.default(wasmBytes);
  log('ok','WASM ready');
  setStatus('ready','ready');
}catch(e){log('err','wasm init: '+e.message);setStatus('err','init failed');throw e;}

/* ───── Renderer ───── */
const renderer = new StickNodesRenderer(canvas);
renderer.onNodeChanged(()=>{
  // When a node is dragged, refresh XML text and tree
  if(currentFig){
    xmlEl.value=figureToXml(currentFig);
    updateXmlMeta();
    renderTree(currentFig);
  }
});

/* ───── Presets ───── */
const BODY='#42489DFF',SKIN='#FFCC99FF';
const PRESETS={

    '    <node type="FilledCircle" length="20" thickness="40" angle="0" color="'+SKIN+'" useSegmentColor="true"/>',

    '    <node type="RoundedSegment" length="50" thickness="14" angle="40" color="'+BODY+'" useSegmentColor="true"/>',

    '    <node type="RoundedSegment" length="55" thickness="14" angle="90" color="'+BODY+'" useSegmentColor="true"/>',
    '  </node>',
    '</stickfigure>'].join('\n'),
  waving:[
    '<?xml version="1.0"?>',
    '<stickfigure version="425" build="100" scale="1.0" color="#202020FF">',
    '  <node type="RoundedSegment" length="65" thickness="20" angle="270" color="'+BODY+'" useSegmentColor="true">',
    '    <node type="FilledCircle" length="20" thickness="40" angle="0" color="'+SKIN+'" useSegmentColor="true"/>',
    '    <node type="RoundedSegment" length="45" thickness="12" angle="70" color="'+BODY+'" useSegmentColor="true">',

    '  </node>',
    '  <node type="RoundedSegment" length="60" thickness="16" angle="70" color="'+BODY+'" useSegmentColor="true">',
    '    <node type="RoundedSegment" length="55" thickness="14" angle="20" color="'+BODY+'" useSegmentColor="true"/>',
    '  </node>',
    '  <node type="RoundedSegment" length="60" thickness="16" angle="110" color="'+BODY+'" useSegmentColor="true">',
    '    <node type="RoundedSegment" length="55" thickness="14" angle="-20" color="'+BODY+'" useSegmentColor="true"/>',
    '  </node>',
    '</stickfigure>'].join('\n'),
};

/* ───── XML parsing ───── */
const NODE_TYPE_NAME={[-1]:'RootNode',0:'RoundedSegment',1:'Segment',2:'Circle',3:'Triangle',4:'FilledCircle',5:'Ellipse',6:'Trapezoid',7:'Polygon'};
const NODE_TYPE_VALID={RoundedSegment:1,Segment:1,Circle:1,Triangle:1,FilledCircle:1,Ellipse:1,Trapezoid:1,Polygon:1};

function colorToWasm(hex){
  let h=String(hex).replace(/^#/,'');
  if(h.length===3)h=h.split('').map(c=>c+c).join('')+'FF';
  else if(h.length===4)h=h.split('').map(c=>c+c).join('');
  else if(h.length===6)h+='FF';
  return{red:parseInt(h.slice(0,2),16),green:parseInt(h.slice(2,4),16),
         blue:parseInt(h.slice(4,6),16),alpha:parseInt(h.slice(6,8),16)};
}

function nodeOptionsFromEl(el){
  const o={};
  if(el.hasAttribute('type')){
    const t=el.getAttribute('type');
    if(!NODE_TYPE_VALID[t])throw new Error('unknown type '+t);
    o.nodeType=t;
  }
  const num={length:'length',defaultLength:'defaultLength',
    thickness:'thickness',defaultThickness:'defaultThickness',
    scale:'scale',angle:'localAngle',defaultAngle:'defaultAngle',
    defaultLocalAngle:'defaultLocalAngle',
    curveRadius:'segmentCurveRadiusAndDefaultCurveRadius',
    curvePrecision:'segmentCurvePolyfillPrecision',
    trapezoidStartThickness:'trapezoidThicknessStart',
    trapezoidEndThickness:'trapezoidThicknessEnd',
    polygonVertices:'numPolygonVertices',
    angleLockRelativeMultiplier:'angleLockRelativeMultiplier',
    dragLockAngle:'dragLockAngle',
    smartStretchMultiplier:'smartStretchMultiplier'};
  for(const a in num)
    if(el.hasAttribute(a))o[num[a]]=parseFloat(el.getAttribute(a));
  const bool={static:'isStatic',stretchy:'isStretchy',floaty:'isFloaty',
    smartStretch:'isSmartStretch',
    doNotApplySmartStretch:'doNotApplySmartStretch',
    smartStretchResetImpulse:'smartStretchResetImpulse',
    useSegmentColor:'useSegmentColor',
    useCircleOutline:'useCircleOutline',
    hollow:'circleIsHollow',
    useGradient:'useGradient',reverseGradient:'reverseGradient',
    useSegmentScale:'useSegmentScale',
    curveCirculization:'curveCirculization',
    halfArc:'halfArc',
    triangleFlipped:'triangleFlipped',
    triangleUpsideDown:'triangleUpsideDown',
    useTrapezoidStart:'useTrapezoidThicknessStart',
    useTrapezoidEnd:'useTrapezoidThicknessEnd',
    trapezoidRoundedStart:'trapezoidIsRoundedStart',
    trapezoidRoundedEnd:'trapezoidIsRoundedEnd',
    dragLocked:'isDragLocked'};
  for(const a in bool)
    if(el.hasAttribute(a)){
      const v=el.getAttribute(a);
      o[bool[a]]=!(v==='false'||v==='0'||v==='');
    }
  const cols={color:'color',gradientColor:'gradientColor',outlineColor:'circleOutlineColor'};
  for(const a in cols)
    if(el.hasAttribute(a))o[cols[a]]=colorToWasm(el.getAttribute(a));
  if(el.hasAttribute('gradientMode'))o.gradientMode=el.getAttribute('gradientMode');
  if(el.hasAttribute('triangleType'))o.triangleType=el.getAttribute('triangleType');
  if(el.hasAttribute('angleLock'))o.angleLockMode=el.getAttribute('angleLock');
  return o;
}

function buildFigure(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  const perr=doc.querySelector('parsererror');
  if(perr)throw new Error('XML parse error: '+perr.textContent.trim());
  const rootEl=doc.documentElement;
  if(rootEl.tagName.toLowerCase()!=='stickfigure')throw new Error('root must be <stickfigure>');

  const fig=new mod.Stickfigure();
  try{fig.setNodeLimitEnabled(false);}catch(_){}
  if(rootEl.hasAttribute('version'))fig.setVersion(parseInt(rootEl.getAttribute('version'),10));
  if(rootEl.hasAttribute('build'))fig.build=parseInt(rootEl.getAttribute('build'),10);
  if(rootEl.hasAttribute('scale'))fig.scale=parseFloat(rootEl.getAttribute('scale'));
  if(rootEl.hasAttribute('color'))fig.colorHex=rootEl.getAttribute('color');

  const root=fig.rootNode();
  let added=0;
  const walk=(parent,containerEl)=>{
    for(const el of containerEl.children){
      if(el.tagName.toLowerCase()!=='node')continue;
      const child=parent.addChild(nodeOptionsFromEl(el));
      added++;
      walk(child,el);
    }
  };
  walk(root,rootEl);

  let pf=0;
  for(const el of rootEl.children){
    if(el.tagName.toLowerCase()!=='polyfill')continue;
    try{
      fig.addPolyfill({
        anchor:parseInt(el.getAttribute('anchor')||'0',10),
        colorHex:el.getAttribute('color')||'#000000FF',
        useColor:el.getAttribute('useColor')!=='false',
        attached:(el.getAttribute('attached')||'').split(',').filter(Boolean).map(Number),
      });
      pf++;
    }catch(e){log('err','polyfill skipped: '+e.message);}
  }
  return{fig,added,pf};
}

/* ───── Tree ───── */
function renderTree(fig){
  treeEl.textContent='';
  const visit=(node,depth)=>{
    const row=document.createElement('div');row.className='row';
    const branch=document.createElement('span');branch.className='branch';
    branch.textContent='│ '.repeat(Math.min(depth,20));
    const idx=document.createElement('span');idx.className='idx';
    idx.textContent='['+node.drawIndex+']';
    const type=document.createElement('span');type.className='type';
    type.textContent=NODE_TYPE_NAME[node.nodeType]||node.nodeType;
    const swatch=document.createElement('span');swatch.className='swatch';
    try{swatch.style.background=node.colorHex;}catch(_){}
    const props=document.createElement('span');props.className='props';
    let p='';
    if(node.length)p+='len='+node.length.toFixed(1)+' ';
    if(node.thickness)p+='th='+node.thickness+' ';
    if(node.localAngle)p+='∠'+node.localAngle.toFixed(1)+'°';
    props.textContent=p;
    row.appendChild(branch);row.appendChild(idx);row.appendChild(type);
    row.appendChild(swatch);row.appendChild(props);
    treeEl.appendChild(row);
    for(const k of node.children())visit(k,depth+1);
  };
  visit(fig.rootNode(),0);
}

/* ───── XML export ───── */
function figureToXml(fig){
  const out=['<?xml version="1.0"?>'];
  out.push('<stickfigure version="'+fig.version+'" build="'+fig.build+
    '" scale="'+fig.scale+'" color="'+fig.colorHex+'">');
  const write=(node,depth)=>{
    const pad='  '.repeat(depth);
    const a=[];
    const t=NODE_TYPE_NAME[node.nodeType];
    if(t&&t!=='RootNode')a.push('type="'+t+'"');
    if(node.length)a.push('length="'+node.length+'"');
    if(node.thickness)a.push('thickness="'+node.thickness+'"');
    if(node.localAngle)a.push('angle="'+node.localAngle+'"');
    if(node.useSegmentColor){
      try{a.push('color="'+node.colorHex+'"');
        a.push('useSegmentColor="true"');}catch(_){}
    }
    if(node.useSegmentScale)a.push('useSegmentScale="true"');
    const kids=node.children();
    const open=pad+'<node '+a.join(' ');
    if(!kids.length){out.push(open+'/>');return;}
    out.push(open+'>');
    for(const k of kids)write(k,depth+1);
    out.push(pad+'</node>');
  };
  for(const k of fig.rootNode().children())write(k,1);
  out.push('</stickfigure>');
  return out.join('\n');
}

/* ───── UI ───── */
let currentFig=null;

function updateXmlMeta(){
  const t=xmlEl.value;
  $('xmlMeta').textContent=t.split('\n').length+' lines · '+new Blob([t]).size+' B';
}
xmlEl.addEventListener('input',updateXmlMeta);

function buildAndShow(){
  clearLog();
  try{
    const r=buildFigure(xmlEl.value);
    currentFig=r.fig;
    renderer.setFigure(r.fig);
    const info=renderer.render();
    renderTree(r.fig);
    log('ok','built '+r.added+' nodes'+(r.pf?', '+r.pf+' fills':''));
    $('previewMeta').textContent='×'+info.fit.toFixed(3)+'  ·  '+info.nodeCount+
      ' nodes'+(info.fillCount?'  ·  '+info.fillCount+' fills':'');
  }catch(e){log('err',e.message);toast('Build failed: '+e.message);}
}

$('btnBuild').addEventListener('click',buildAndShow);

$('btnDownload').addEventListener('click',()=>{
  try{
    if(!currentFig)buildAndShow();
    if(!currentFig)return;
    const bytes=currentFig.toBytes();
    const blob=new Blob([bytes],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='figure.nodes';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    log('ok','exported '+bytes.length+' bytes');
    toast('Downloaded figure.nodes');
  }catch(e){log('err',e.message);}
});

$('btnExport').addEventListener('click',()=>{
  try{
    if(!currentFig)buildAndShow();
    if(!currentFig)return;
    xmlEl.value=figureToXml(currentFig);
    updateXmlMeta();
    log('ok','XML updated from current figure');
    toast('XML written');
  }catch(e){log('err',e.message);}
});

$('btnCopy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(xmlEl.value);toast('Copied');}
  catch(_){xmlEl.focus();xmlEl.select();toast('Select-all — Ctrl+C');}
});

$('btnLoad').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',async()=>{
  const f=fileInput.files[0];if(!f)return;
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const fig=mod.Stickfigure.fromBytes(buf);
    try{fig.setNodeLimitEnabled(false);}catch(_){}
    currentFig=fig;
    renderer.setFigure(fig);
    const info=renderer.render();
    renderTree(fig);
    xmlEl.value=figureToXml(fig);updateXmlMeta();
    log('ok','loaded '+f.name+' · '+buf.length+' bytes');
    $('previewMeta').textContent='×'+info.fit.toFixed(3)+'  ·  '+info.nodeCount+
      ' nodes'+(info.fillCount?'  ·  '+info.fillCount+' fills':'');
    toast('Loaded '+f.name);
  }catch(e){log('err','load: '+e.message);}
  finally{fileInput.value='';}
});

$('btnDrag').addEventListener('click',()=>{
  const on=!$('btnDrag').classList.contains('on');
  $('btnDrag').classList.toggle('on',on);
  renderer.setDragEnabled(on);
  toast('Drag: '+(on?'ON — tap a node tip':'OFF'));
});
$('btnFills').addEventListener('click',()=>{
  const on=!$('btnFills').classList.contains('on');
  $('btnFills').classList.toggle('on',on);
  renderer.setFills(on);
  renderer.render();
  toast('Fills: '+(on?'ON':'OFF'));
});

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.querySelector('.tab-content[data-tab="'+b.dataset.tab+'"]').classList.add('active');
}));

$('preset').addEventListener('change',e=>{
  const k=e.target.value;if(!k)return;
  xmlEl.value=PRESETS[k];updateXmlMeta();buildAndShow();
  e.target.value='';
});

/* Init */
xmlEl.value=PRESETS.standing;
updateXmlMeta();
buildAndShow();
window.addEventListener('resize',()=>{if(currentFig)renderer.render();});
</script>
</body>
</html>
